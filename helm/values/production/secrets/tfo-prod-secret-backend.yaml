##############################################################################
# Production Secret — tfo-backend-secrets
#
# Backend application credentials: database passwords, JWT/session secrets,
# encryption keys. Values from staging manifests MUST NOT be reused —
# generate fresh secrets for production.
#
# Apply this BEFORE running helm upgrade --install (secrets.create: false
# in tfo-production.yaml — the chart expects this secret to already exist).
#
# Generate strong values:
#   openssl rand -hex 32
#
# WARNING: Replace every placeholder before applying. Do NOT commit real
#          secrets to git — use ESO, Vault, or AWS Secrets Manager.
#
# Apply:
#   kubectl apply -f helm/values/production/secrets/tfo-prod-secret-backend.yaml \
#     -n observability
#
# Or via AWS Secrets Manager + ESO:
#   Store as: telemetryflow/prod/backend/secrets
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: tfo-backend-secrets
  namespace: observability
  labels:
    app.kubernetes.io/part-of: telemetryflow
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kubectl
    telemetryflow.io/platform: telemetryflow
    telemetryflow.io/environment: production
  annotations:
    # Uncomment to enable External Secrets Operator sync
    # external-secrets.io/remote-ref-key: telemetryflow/prod/backend/secrets
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "REPLACE_ME"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"

  # JWT Secrets
  JWT_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  SESSION_SECRET: "REPLACE_ME"

  # Encryption Keys
  ENCRYPTION_KEY: "REPLACE_ME"
  MFA_ENCRYPTION_KEY: "REPLACE_ME"
  LLM_ENCRYPTION_KEY: "REPLACE_ME"
  AUTH0_CLIENT_SECRET: ""
  RECAPTCHA_SECRET_KEY: ""

  # SMTP + valkey + DB monitoring
  SMTP_USER: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
  VALKEY_PASSWORD: "REPLACE_ME"
  BULLMQ_VALKEY_PASSWORD: "REPLACE_ME"
  DB_MONITORING_ENCRYPTION_KEY: "REPLACE_ME"
