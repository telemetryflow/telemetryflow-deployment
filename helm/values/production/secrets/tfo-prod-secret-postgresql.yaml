##############################################################################
# Production Secret — tfo-postgresql-secret
#
# PostgreSQL credentials. The three keys must stay in sync (same password)
# unless you intentionally separate the replication user.
#
# Generate a strong value:
#   openssl rand -base64 32
#
# Apply this BEFORE running helm upgrade --install (secrets.create: false
# in tfo-production.yaml).
#
# Apply:
#   kubectl apply -f helm/values/production/secrets/tfo-prod-secret-postgresql.yaml \
#     -n observability
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: tfo-postgresql-secret
  namespace: observability
  labels:
    app.kubernetes.io/part-of: telemetryflow
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/managed-by: kubectl
    telemetryflow.io/platform: telemetryflow
    telemetryflow.io/environment: production
type: Opaque
stringData:
  postgres-password: "REPLACE_ME"
  password: "REPLACE_ME"
  replication-password: "REPLACE_ME"
