##############################################################################
# Production Secret — TelemetryFlow Platform
#
# Apply this BEFORE running helm upgrade --install for tfo-collector-telemetryflow.
#
# WARNING: Replace placeholder values with real API keys from
#          TFO Platform > API Keys before applying.
#          Do NOT commit real keys to git — use ESO, Vault, or AWS Secrets Manager.
#
# Apply:
#   kubectl apply -f helm/values/production/secrets/tfo-prod-secret-telemetryflow.yaml \
#     -n observability
#
# Or via AWS Secrets Manager + ESO:
#   Store as: telemetryflow/prod/telemetryflow/tfo-collector-api-key
#   Keys: TELEMETRYFLOW_API_KEY_ID, TELEMETRYFLOW_API_KEY_SECRET
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: tfo-collector-telemetryflow-secret
  namespace: observability
  labels:
    app.kubernetes.io/part-of: telemetryflow
    app.kubernetes.io/component: collector
    app.kubernetes.io/managed-by: kubectl
    telemetryflow.io/platform: telemetryflow
    telemetryflow.io/environment: production
  annotations:
    # Uncomment to enable External Secrets Operator sync
    # external-secrets.io/remote-ref-key: telemetryflow/prod/telemetryflow/tfo-collector-api-key
type: Opaque
stringData:
  # Placeholder — replace with real credentials from TFO Platform > API Keys
  TELEMETRYFLOW_API_KEY_ID: "tfk_REPLACE_ME"
  TELEMETRYFLOW_API_KEY_SECRET: "REPLACE_ME"
