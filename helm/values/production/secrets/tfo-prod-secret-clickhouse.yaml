##############################################################################
# Production Secret — tfo-clickhouse-secret
#
# ClickHouse credentials.
#
# Generate a strong value:
#   openssl rand -base64 32
#
# Apply this BEFORE running helm upgrade --install (secrets.create: false
# in tfo-production.yaml).
#
# Apply:
#   kubectl apply -f helm/values/production/secrets/tfo-prod-secret-clickhouse.yaml \
#     -n observability
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: tfo-clickhouse-secret
  namespace: observability
  labels:
    app.kubernetes.io/part-of: telemetryflow
    app.kubernetes.io/component: clickhouse
    app.kubernetes.io/managed-by: kubectl
    telemetryflow.io/platform: telemetryflow
    telemetryflow.io/environment: production
type: Opaque
stringData:
  password: "REPLACE_ME"
