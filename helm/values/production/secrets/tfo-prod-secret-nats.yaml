##############################################################################
# Production Secret — tfo-nats-secret
#
# NATS credentials. Set a real password — staging runs with an empty one,
# production must not.
#
# Generate a strong value:
#   openssl rand -base64 32
#
# Apply this BEFORE running helm upgrade --install (secrets.create: false
# in tfo-production.yaml).
#
# Apply:
#   kubectl apply -f helm/values/production/secrets/tfo-prod-secret-nats.yaml \
#     -n observability
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: tfo-nats-secret
  namespace: observability
  labels:
    app.kubernetes.io/part-of: telemetryflow
    app.kubernetes.io/component: nats
    app.kubernetes.io/managed-by: kubectl
    telemetryflow.io/platform: telemetryflow
    telemetryflow.io/environment: production
type: Opaque
stringData:
  nats-password: "REPLACE_ME"
