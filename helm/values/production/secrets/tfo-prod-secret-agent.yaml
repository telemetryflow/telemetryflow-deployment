##############################################################################
# Production Secret — tfo-agent-secret
#
# Agent API keys used by tfo-agent (DaemonSet + tfo-agent-k8s) to
# authenticate against the collector's v2 OTLP receiver and the backend
# API. Get real values from TFO Platform > API Keys.
#
# Apply this BEFORE running helm upgrade --install (secrets.create: false
# in tfo-production.yaml).
#
# WARNING: Replace placeholder values with real API keys. Do NOT commit
#          real keys to git — use ESO, Vault, or AWS Secrets Manager.
#          Rotate the key before granting external access.
#
# Apply:
#   kubectl apply -f helm/values/production/secrets/tfo-prod-secret-agent.yaml \
#     -n observability
#
# Or via AWS Secrets Manager + ESO:
#   Store as: telemetryflow/prod/agent/api-key
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: tfo-agent-secret
  namespace: observability
  labels:
    app.kubernetes.io/part-of: telemetryflow
    app.kubernetes.io/component: agent
    app.kubernetes.io/managed-by: kubectl
    telemetryflow.io/platform: telemetryflow
    telemetryflow.io/environment: production
  annotations:
    # Uncomment to enable External Secrets Operator sync
    # external-secrets.io/remote-ref-key: telemetryflow/prod/agent/api-key
type: Opaque
stringData:
  TELEMETRYFLOW_API_KEY_ID: "tfk_REPLACE_ME"
  TELEMETRYFLOW_API_KEY_SECRET: "REPLACE_ME"
