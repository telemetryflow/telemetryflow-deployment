##############################################################################
# Production Secret — tfo-redis-secret
#
# Redis (BullMQ job store) credentials. Set a real password — staging runs
# with an empty one, production must not.
#
# Generate a strong value:
#   openssl rand -base64 32
#
# Must match REDIS_PASSWORD in tfo-prod-secret-backend.yaml.
#
# Apply this BEFORE running helm upgrade --install (secrets.create: false
# in tfo-production.yaml).
#
# Apply:
#   kubectl apply -f helm/values/production/secrets/tfo-prod-secret-redis.yaml \
#     -n observability
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: tfo-redis-secret
  namespace: observability
  labels:
    app.kubernetes.io/part-of: telemetryflow
    app.kubernetes.io/component: redis
    app.kubernetes.io/managed-by: kubectl
    telemetryflow.io/platform: telemetryflow
    telemetryflow.io/environment: production
type: Opaque
stringData:
  redis-password: "REPLACE_ME"
