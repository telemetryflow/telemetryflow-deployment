{{- if and .Values.clickhouse.enabled .Values.exporters.clickhouse.enabled }}
---
##############################################################################
# ClickHouse Metrics — Service
# Exposes ClickHouse built-in Prometheus endpoint (port 9363, path /metrics).
# Configured via <prometheus> block in clickhouse config.xml.
# Scraped by tfo-collector prometheus/infra receiver → metrics/infra pipeline.
##############################################################################
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.exporters.clickhouse.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.exporters.clickhouse.name }}
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: telemetryflow
    {{- include "telemetryflow.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.exporters.clickhouse.port | quote }}
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
  ports:
    - name: metrics
      port: {{ .Values.exporters.clickhouse.port }}
      targetPort: {{ .Values.exporters.clickhouse.port }}
      protocol: TCP
---
{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.exporters.clickhouse.name }}
  namespace: {{ .Values.monitoring.serviceMonitor.namespace | default (include "telemetryflow.namespace" .) }}
  labels:
    app.kubernetes.io/name: {{ .Values.exporters.clickhouse.name }}
    app.kubernetes.io/component: exporter
    {{- include "telemetryflow.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "telemetryflow.namespace" . }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.exporters.clickhouse.name }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      path: /metrics
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: instance
        - targetLabel: service
          replacement: clickhouse
        - targetLabel: component
          replacement: analytics
{{- end }}
{{- end }}
