{{- if .Values.cacheRedis.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-redis-config
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: cache-redis
    {{- include "telemetryflow.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    {{- range $key, $value := .Values.cacheRedis.config }}
    {{ $key }} {{ $value }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cache-redis
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: cache-redis
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: cache-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache-redis
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: cache-redis
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  serviceName: cache-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-redis
    spec:
      {{- include "telemetryflow.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.cacheRedis.image.repository }}:{{ .Values.cacheRedis.image.tag }}"
          imagePullPolicy: {{ .Values.cacheRedis.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              redis-server /etc/redis/redis.conf \
                --requirepass "$REDIS_PASSWORD" \
                --masterauth "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.redis.name }}
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.cacheRedis.resources | nindent 12 }}
          volumeMounts:
            - name: cache-redis-data
              mountPath: /data
            - name: cache-redis-config
              mountPath: /etc/redis
      volumes:
        - name: cache-redis-config
          configMap:
            name: cache-redis-config
        {{- if not .Values.cacheRedis.persistence.enabled }}
        - name: cache-redis-data
          emptyDir: {}
        {{- end }}
  {{- if .Values.cacheRedis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache-redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.cacheRedis.persistence.storageClass }}
        {{- if .Values.cacheRedis.persistence.storageClass }}

        storageClassName: {{ .Values.cacheRedis.persistence.storageClass | quote }}

        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cacheRedis.persistence.size }}
  {{- end }}
{{- end }}
