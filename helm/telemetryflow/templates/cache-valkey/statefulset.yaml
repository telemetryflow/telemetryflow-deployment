{{- if .Values.cacheValkey.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-valkey-config
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: cache-valkey
    {{- include "telemetryflow.labels" . | nindent 4 }}
data:
  valkey.conf: |
    bind 0.0.0.0
    port 6379
    {{- range $key, $value := .Values.cacheValkey.config }}
    {{ $key }} {{ $value }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cache-valkey
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: cache-valkey
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
  selector:
    app.kubernetes.io/name: cache-valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache-valkey
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: cache-valkey
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  serviceName: cache-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-valkey
    spec:
      {{- include "telemetryflow.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: "{{ .Values.cacheValkey.image.repository }}:{{ .Values.cacheValkey.image.tag }}"
          imagePullPolicy: {{ .Values.cacheValkey.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              valkey-server /etc/valkey/valkey.conf \
                --requirepass "$VALKEY_PASSWORD" \
                --masterauth "$VALKEY_PASSWORD"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.valkey.name }}
                  key: valkey-password
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli -a "$VALKEY_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.cacheValkey.resources | nindent 12 }}
          volumeMounts:
            - name: cache-valkey-data
              mountPath: /data
            - name: cache-valkey-config
              mountPath: /etc/valkey
      {{- with .Values.cacheValkey.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cacheValkey.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: cache-valkey-config
          configMap:
            name: cache-valkey-config
        {{- if not .Values.cacheValkey.persistence.enabled }}
        - name: cache-valkey-data
          emptyDir: {}
        {{- end }}
  {{- if .Values.cacheValkey.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache-valkey-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.cacheValkey.persistence.storageClass }}
        {{- if .Values.cacheValkey.persistence.storageClass }}

        storageClassName: {{ .Values.cacheValkey.persistence.storageClass | quote }}

        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cacheValkey.persistence.size }}
  {{- end }}
{{- end }}
