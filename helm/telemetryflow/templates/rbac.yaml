{{/*
TelemetryFlow RBAC - Kubernetes 1.34 Compatible

RBAC hierarchy:
  tfoAgent:     ClusterRole + ClusterRoleBinding  (cluster-wide node/pod/metrics collection)
  tfoCollector: ClusterRole + ClusterRoleBinding  (cluster-wide pod attribute enrichment)
  tfoBackend:   Role        + RoleBinding         (namespace-scoped leader election + events)
  tfoViz:       ServiceAccount only               (no K8s API access — static file server)
  postgresql:   ServiceAccount only               (no K8s API access)
  clickhouse:   ServiceAccount only               (no K8s API access)
  redis:        ServiceAccount only               (no K8s API access)
  nats:         ServiceAccount only               (no K8s API access)

All ClusterRole names are namespaced with the release namespace to avoid
cross-release collisions in shared clusters.
*/}}

{{/*
==============================================================================
TFO BACKEND — Role + RoleBinding (namespace-scoped)
Permissions:
  - coordination.k8s.io/leases: leader election for multi-replica deployments
  - core/events:                record Kubernetes events from NestJS
==============================================================================
*/}}
{{- if and .Values.tfoBackend.enabled .Values.tfoBackend.serviceAccount.create }}
{{- if .Values.tfoBackend.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.tfoBackend.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
    app.kubernetes.io/component: backend
    {{- include "telemetryflow.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.tfoBackend.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tfoBackend.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
    app.kubernetes.io/component: backend
    {{- include "telemetryflow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.tfoBackend.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tfoBackend.serviceAccount.name }}
    namespace: {{ include "telemetryflow.namespace" . }}
{{- end }}
{{- end }}

{{/*
==============================================================================
TFO COLLECTOR — ClusterRole + ClusterRoleBinding
Permissions:
  - pods, namespaces, nodes, endpoints, services: k8s attribute enrichment
  - replicasets, deployments, statefulsets, daemonsets: workload context
  - events: trace event correlation
  - nodes/stats, nodes/proxy: Kubelet metrics scraping
  - /metrics, /metrics/cadvisor: non-resource URL scraping (cAdvisor)
==============================================================================
*/}}
{{- if and .Values.tfoCollector.enabled .Values.tfoCollector.serviceAccount.create }}
{{- if .Values.tfoCollector.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "telemetryflow.namespace" . }}-{{ .Values.tfoCollector.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoCollector.name }}
    app.kubernetes.io/component: collector
    {{- include "telemetryflow.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.tfoCollector.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "telemetryflow.namespace" . }}-{{ .Values.tfoCollector.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoCollector.name }}
    app.kubernetes.io/component: collector
    {{- include "telemetryflow.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "telemetryflow.namespace" . }}-{{ .Values.tfoCollector.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tfoCollector.serviceAccount.name }}
    namespace: {{ include "telemetryflow.namespace" . }}
{{- end }}
{{- end }}

{{/*
==============================================================================
TFO VIZ — ServiceAccount only
nginx SPA server has no need to call the Kubernetes API.
automountServiceAccountToken: false prevents token projection entirely.
==============================================================================
*/}}
{{- if and .Values.tfoViz.enabled .Values.tfoViz.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tfoViz.serviceAccount.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoViz.name }}
    app.kubernetes.io/component: frontend
    {{- include "telemetryflow.labels" . | nindent 4 }}
  {{- with .Values.tfoViz.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

{{/*
==============================================================================
INFRASTRUCTURE SERVICE ACCOUNTS
PostgreSQL, ClickHouse, Redis, NATS — dedicated SAs with no K8s API access.
Workload identity isolation prevents any credential from calling the API server.
==============================================================================
*/}}

{{- if .Values.postgresql.enabled }}
{{- if .Values.postgresql.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.postgresql.serviceAccount.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgresql.name }}
    app.kubernetes.io/component: database
    {{- include "telemetryflow.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}

{{- if .Values.clickhouse.enabled }}
{{- if .Values.clickhouse.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.clickhouse.serviceAccount.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
    app.kubernetes.io/component: analytics-database
    {{- include "telemetryflow.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}

{{- if .Values.bullmq.enabled }}
{{- if .Values.bullmq.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.bullmq.serviceAccount.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: queue
    {{- include "telemetryflow.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}

{{- if .Values.nats.enabled }}
{{- if .Values.nats.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.nats.serviceAccount.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.nats.name }}
    app.kubernetes.io/component: messaging
    {{- include "telemetryflow.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
