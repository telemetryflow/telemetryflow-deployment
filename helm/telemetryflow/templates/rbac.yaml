{{/*
ServiceAccount, ClusterRole, and ClusterRoleBinding for tfo-agent
*/}}
{{- if and .Values.tfoAgent.enabled .Values.tfoAgent.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "telemetryflow.serviceAccountName" (dict "serviceAccount" .Values.tfoAgent.serviceAccount "component" "agent" "context" $) }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
{{- if .Values.tfoAgent.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-tfo-agent
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
rules:
  {{- toYaml .Values.tfoAgent.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-tfo-agent
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-tfo-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "telemetryflow.serviceAccountName" (dict "serviceAccount" .Values.tfoAgent.serviceAccount "component" "agent" "context" $) }}
    namespace: {{ include "telemetryflow.namespace" . }}
{{- end }}
---
{{- end }}

