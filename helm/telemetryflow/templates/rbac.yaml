{{/*
ServiceAccount, ClusterRole, and ClusterRoleBinding for tfo-backend
*/}}
{{- if and .Values.tfoBackend.enabled .Values.tfoBackend.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "telemetryflow.serviceAccountName" (dict "serviceAccount" .Values.tfoBackend.serviceAccount "component" "backend" "context" $) }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- if .Values.tfoBackend.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-tfo-backend
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  {{- if .Values.tfoBackend.rbac.rules }}
  {{- toYaml .Values.tfoBackend.rbac.rules | nindent 2 }}
  {{- else }}
  - apiGroups: [""]
    resources: ["pods", "namespaces", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-tfo-backend
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-tfo-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "telemetryflow.serviceAccountName" (dict "serviceAccount" .Values.tfoBackend.serviceAccount "component" "backend" "context" $) }}
    namespace: {{ include "telemetryflow.namespace" . }}
{{- end }}
---
{{- end }}

