{{/*
Registry image pull secrets (DockerHub / ECR).

Creates dockerconfigjson Secrets from values.imagePullSecrets. Enabled
entries are also injected automatically into every workload spec by the
telemetryflow.imagePullSecrets helper — no need to repeat them under
global.imagePullSecrets.

ECR note: the token from `aws ecr get-login-password` expires (~12h).
For long-lived deployments use External Secrets Operator or a refresh
CronJob instead of a static password here.
*/}}
{{- range $key, $cfg := .Values.imagePullSecrets }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  labels:
    {{- include "telemetryflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: image-pull-secret
    app.kubernetes.io/config: {{ $key }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $cfg.registry (dict "username" $cfg.username "password" $cfg.password "email" ($cfg.email | default "") "auth" (printf "%s:%s" $cfg.username $cfg.password | b64enc))) | toJson | b64enc }}
{{- end }}
{{- end }}
