{{- if and .Values.bullmq.enabled .Values.bullmq.board.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetryflow.fullname" . }}-bull-board
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: bull-board
spec:
  replicas: {{ .Values.bullmq.board.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "telemetryflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bull-board
  template:
    metadata:
      labels:
        {{- include "telemetryflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: bull-board
      annotations:
        checksum/values: {{ toYaml .Values.bullmq.board | sha256sum }}
    spec:
      containers:
        - name: bull-board
          {{- include "telemetryflow.image" (dict "repository" .Values.bullmq.board.image.repository "tag" .Values.bullmq.board.image.tag "pullPolicy" .Values.bullmq.board.image.pullPolicy) | nindent 10 }}
          env:
            - name: REDIS_URL
              value: "redis://{{ include "telemetryflow.fullname" . }}-redis-master:6379"
            - name: TZ
              value: {{ .Values.global.timezone | default "UTC" | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            {{- toYaml .Values.bullmq.board.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetryflow.fullname" . }}-bull-board
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: bull-board
spec:
  type: {{ .Values.bullmq.board.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.bullmq.board.service.port | default 3000 }}
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "telemetryflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bull-board
{{- end }}
