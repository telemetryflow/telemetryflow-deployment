{{- if .Values.tfoBackend.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tfoBackend.serviceAccount.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
    app.kubernetes.io/component: backend
    {{- include "telemetryflow.labels" . | nindent 4 }}
  {{- with .Values.tfoBackend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.tfoBackend.serviceAccount.automountServiceAccountToken | default false }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.tfoBackend.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.tfoBackend.service.type }}
  ports:
    - name: http
      port: {{ .Values.tfoBackend.ports.http }}
      targetPort: {{ .Values.tfoBackend.ports.http }}
      protocol: TCP
    - name: otlp-grpc
      port: {{ .Values.tfoBackend.ports.otlpGrpc }}
      targetPort: {{ .Values.tfoBackend.ports.otlpGrpc }}
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.tfoBackend.ports.otlpHttp }}
      targetPort: {{ .Values.tfoBackend.ports.otlpHttp }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.tfoBackend.name }}-env
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
    {{- include "telemetryflow.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.tfoBackend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tfoBackend.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
    app.kubernetes.io/component: backend
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.tfoBackend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/env: {{ toYaml .Values.tfoBackend.env | sha256sum }}
        checksum/image: {{ printf "%s:%s" .Values.tfoBackend.image.repository .Values.tfoBackend.image.tag | sha256sum }}
    spec:
      {{- include "telemetryflow.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Values.tfoBackend.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with .Values.tfoBackend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.tfoBackend.initContainers.waitForPostgres.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.tfoBackend.initContainers.waitForPostgres.image }}
          command:
            {{- toYaml .Values.tfoBackend.initContainers.waitForPostgres.command | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
        {{- if .Values.tfoBackend.initContainers.waitForClickHouse.enabled }}
        - name: wait-for-clickhouse
          image: {{ .Values.tfoBackend.initContainers.waitForClickHouse.image }}
          command:
            {{- toYaml .Values.tfoBackend.initContainers.waitForClickHouse.command | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
        {{- if .Values.tfoBackend.initContainers.waitForValkey.enabled }}
        - name: wait-for-valkey
          image: {{ .Values.tfoBackend.initContainers.waitForValkey.image }}
          command:
            {{- toYaml .Values.tfoBackend.initContainers.waitForValkey.command | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
        {{- if .Values.tfoBackend.initContainers.waitForNats.enabled }}
        - name: wait-for-nats
          image: {{ .Values.tfoBackend.initContainers.waitForNats.image }}
          command:
            {{- toYaml .Values.tfoBackend.initContainers.waitForNats.command | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
        {{- if .Values.tfoBackend.initContainers.runMigrations.enabled }}
        - name: run-migrations
          image: "{{ .Values.tfoBackend.image.repository }}:{{ .Values.tfoBackend.image.tag }}"
          imagePullPolicy: {{ .Values.tfoBackend.image.pullPolicy }}
          command:
            {{- toYaml .Values.tfoBackend.initContainers.runMigrations.command | nindent 12 }}
          envFrom:
            {{- range .Values.tfoBackend.envFromConfigMaps }}
            - configMapRef:
                name: {{ .name }}
            {{- end }}
            - configMapRef:
                name: {{ .Values.tfoBackend.name }}-env
            {{- range .Values.tfoBackend.envFromSecrets }}
            - secretRef:
                name: {{ .name }}
            {{- end }}
          {{- with .Values.tfoBackend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.tfoBackend.initContainers.runSeeds.enabled }}
        - name: run-seeds
          image: "{{ .Values.tfoBackend.image.repository }}:{{ .Values.tfoBackend.image.tag }}"
          imagePullPolicy: {{ .Values.tfoBackend.image.pullPolicy }}
          command:
            {{- toYaml .Values.tfoBackend.initContainers.runSeeds.command | nindent 12 }}
          envFrom:
            {{- range .Values.tfoBackend.envFromConfigMaps }}
            - configMapRef:
                name: {{ .name }}
            {{- end }}
            - configMapRef:
                name: {{ .Values.tfoBackend.name }}-env
            {{- range .Values.tfoBackend.envFromSecrets }}
            - secretRef:
                name: {{ .name }}
            {{- end }}
          {{- with .Values.tfoBackend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      containers:
        - name: tfo-backend
          image: "{{ .Values.tfoBackend.image.repository }}:{{ .Values.tfoBackend.image.tag }}"
          imagePullPolicy: {{ .Values.tfoBackend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.tfoBackend.ports.http }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.tfoBackend.ports.otlpGrpc }}
              name: otlp-grpc
              protocol: TCP
            - containerPort: {{ .Values.tfoBackend.ports.otlpHttp }}
              name: otlp-http
              protocol: TCP
          envFrom:
            {{- range .Values.tfoBackend.envFromConfigMaps }}
            - configMapRef:
                name: {{ .name }}
            {{- end }}
            - configMapRef:
                name: {{ .Values.tfoBackend.name }}-env
            {{- range .Values.tfoBackend.envFromSecrets }}
            - secretRef:
                name: {{ .name }}
            {{- end }}
          {{- with .Values.tfoBackend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tfoBackend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tfoBackend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tfoBackend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.tfoBackend.resources | nindent 12 }}
      {{- with .Values.tfoBackend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tfoBackend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tfoBackend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.tfoBackend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.tfoBackend.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  {{- with .Values.tfoBackend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.tfoBackend.ingress.className }}
  ingressClassName: {{ .Values.tfoBackend.ingress.className }}
  {{- end }}
  {{- if .Values.tfoBackend.ingress.tls }}
  tls:
    {{- toYaml .Values.tfoBackend.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.tfoBackend.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.tfoBackend.name }}
                port:
                  number: {{ $.Values.tfoBackend.ports.http }}
          {{- end }}
    {{- end }}
{{- end }}
---
{{- if .Values.tfoBackend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.tfoBackend.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.tfoBackend.name }}
  minReplicas: {{ .Values.tfoBackend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.tfoBackend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tfoBackend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.tfoBackend.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
{{- end }}
---
{{- if .Values.tfoBackend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.tfoBackend.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
spec:
  minAvailable: {{ .Values.tfoBackend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.tfoBackend.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
