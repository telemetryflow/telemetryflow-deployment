{{- if .Values.tfoAgent.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telemetryflow.fullname" . }}-agent-config
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: tfo-agent
data:
  agent-config.yaml: |
    {{- toYaml .Values.tfoAgent.config | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "telemetryflow.fullname" . }}-agent
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: tfo-agent
spec:
  selector:
    matchLabels:
      {{- include "telemetryflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tfo-agent
  template:
    metadata:
      labels:
        {{- include "telemetryflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: tfo-agent
      annotations:
        checksum/agent-config: {{ toYaml .Values.tfoAgent.config | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.tfoAgent.serviceAccount.name | default (printf "%s-agent" (include "telemetryflow.fullname" .)) }}
      {{- if .Values.tfoAgent.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      hostPID: {{ .Values.tfoAgent.hostPID }}
      securityContext:
        runAsUser: {{ .Values.tfoAgent.securityContext.runAsUser }}
        runAsGroup: {{ .Values.tfoAgent.securityContext.runAsGroup }}
      tolerations:
        {{- toYaml .Values.tfoAgent.tolerations | nindent 8 }}
      containers:
        - name: tfo-agent
          image: "{{ .Values.tfoAgent.image.repository }}:{{ .Values.tfoAgent.image.tag }}"
          imagePullPolicy: {{ .Values.tfoAgent.image.pullPolicy | default .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
          env:
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TELEMETRYFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "telemetryflow.fullname" . }}-agent-secret
                  key: API_KEY
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.global.clusterName | quote }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          resources:
            {{- toYaml .Values.tfoAgent.resources | nindent 12 }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
            - name: config
              mountPath: /etc/tfo-agent
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: hostfs
          hostPath:
            path: /
        - name: config
          configMap:
            name: {{ include "telemetryflow.fullname" . }}-agent-config
{{- end }}
