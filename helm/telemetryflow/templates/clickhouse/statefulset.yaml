{{- if .Values.clickhouse.enabled }}
---
# ClickHouse cluster configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.clickhouse.name }}-config
  namespace: {{ include "telemetryflow.namespace" . }}
data:
  config.xml: |
    <?xml version="1.0"?>
    <clickhouse>
      <logger>
        <level>information</level>
        <log>/var/log/clickhouse-server/clickhouse-server.log</log>
        <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
        <size>1000M</size>
        <count>3</count>
      </logger>

      <!-- System log table TTL — without this, system.text_log / trace_log /
           query_log grow unbounded (text_log alone hit 17 GiB in ~10h on dev).
           TTL is applied server-side so it also governs read-only system tables. -->
      <text_log>
        <level>warning</level>
        <ttl>event_date + INTERVAL 1 DAY</ttl>
      </text_log>
      <trace_log>
        <level>error</level>
        <ttl>event_date + INTERVAL 1 DAY</ttl>
      </trace_log>
      <query_log>
        <ttl>event_date + INTERVAL 1 DAY</ttl>
      </query_log>
      <query_views_log>
        <ttl>event_date + INTERVAL 1 DAY</ttl>
      </query_views_log>
      <part_log>
        <ttl>event_date + INTERVAL 1 DAY</ttl>
      </part_log>
      <metric_log>
        <ttl>event_date + INTERVAL 2 DAY</ttl>
      </metric_log>
      <asynchronous_metric_log>
        <ttl>event_date + INTERVAL 2 DAY</ttl>
      </asynchronous_metric_log>
      <processors_profile_log remove="remove" />
      <opentelemetry_span_log remove="remove" />

      <http_port>{{ .Values.clickhouse.ports.http }}</http_port>
      <tcp_port>{{ .Values.clickhouse.ports.native }}</tcp_port>
      <interserver_http_port>{{ .Values.clickhouse.ports.interserver }}</interserver_http_port>

      <listen_host>::</listen_host>

      <max_connections>4096</max_connections>
      <keep_alive_timeout>3</keep_alive_timeout>
      <max_concurrent_queries>100</max_concurrent_queries>

      <path>/var/lib/clickhouse/</path>
      <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
      <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>
      <format_schema_path>/var/lib/clickhouse/format_schemas/</format_schema_path>

      {{- if .Values.clickhouse.zookeeper.enabled }}
      <!-- ZooKeeper for cluster coordination -->
      <zookeeper>
        {{- $zkReplicas := int .Values.clickhouse.zookeeper.replicas }}
        {{- range $i := until $zkReplicas }}
        <node>
          <host>{{ $.Values.clickhouse.name }}-zk-{{ $i }}.{{ $.Values.clickhouse.name }}-zk-headless</host>
          <port>{{ $.Values.clickhouse.zookeeper.service.port }}</port>
        </node>
        {{- end }}
      </zookeeper>
      {{- end }}

      <!-- Cluster topology: {{ .Values.clickhouse.cluster.shards }} shards × {{ .Values.clickhouse.cluster.replicasPerShard }} replica -->
      <remote_servers>
        <{{ .Values.clickhouse.cluster.name }}>
          {{- $shards := int .Values.clickhouse.cluster.shards }}
          {{- $replicas := int .Values.clickhouse.cluster.replicasPerShard }}
          {{- range $s := until $shards }}
          <shard>
            <internal_replication>true</internal_replication>
            {{- range $r := until $replicas }}
            <replica>
              <host>{{ $.Values.clickhouse.name }}-shard{{ $s }}-{{ $r }}.{{ $.Values.clickhouse.name }}-headless</host>
              <port>{{ $.Values.clickhouse.ports.native }}</port>
            </replica>
            {{- end }}
          </shard>
          {{- end }}
        </{{ .Values.clickhouse.cluster.name }}>
      </remote_servers>

      <macros>
        <cluster>{{ .Values.clickhouse.cluster.name }}</cluster>
        <!-- shard and replica set via env -->
        <shard from_env="CLICKHOUSE_SHARD" />
        <replica from_env="CLICKHOUSE_REPLICA" />
      </macros>

      <distributed_ddl>
        <path>/clickhouse/task_queue/ddl</path>
      </distributed_ddl>

      <!-- Compression -->
      <compression>
        {{- range .Values.clickhouse.config.compression }}
        <case>
          <method>{{ .method }}</method>
          <min_part_size>{{ .min_part_size }}</min_part_size>
          <min_part_size_ratio>{{ .min_part_size_ratio }}</min_part_size_ratio>
        </case>
        {{- end }}
      </compression>

      <!-- MergeTree settings -->
      <merge_tree>
        <replicated_deduplication_window>{{ .Values.clickhouse.config.mergeTree.replicated_deduplication_window }}</replicated_deduplication_window>
        <replicated_deduplication_window_seconds>{{ .Values.clickhouse.config.mergeTree.replicated_deduplication_window_seconds }}</replicated_deduplication_window_seconds>
        <parts_to_delay_insert>{{ .Values.clickhouse.config.mergeTree.parts_to_delay_insert }}</parts_to_delay_insert>
        <parts_to_throw_insert>{{ .Values.clickhouse.config.mergeTree.parts_to_throw_insert }}</parts_to_throw_insert>
        <max_parts_in_total>{{ .Values.clickhouse.config.mergeTree.max_parts_in_total }}</max_parts_in_total>
        <allow_dimensions_outside_sorting_key>{{ .Values.clickhouse.config.mergeTree.allow_dimensions_outside_sorting_key | default 0 }}</allow_dimensions_outside_sorting_key>
      </merge_tree>

      <!-- Prometheus metrics -->
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>{{ .Values.clickhouse.ports.metrics }}</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>

      <!-- Ingestion tuning: async_insert batches inserts to prevent "Too many parts" -->
      <profiles>
        <default>
          <async_insert>1</async_insert>
          <wait_for_async_insert>1</wait_for_async_insert>
          <async_insert_busy_timeout_ms>1000</async_insert_busy_timeout_ms>
          <async_insert_max_data_size>10000000</async_insert_max_data_size>
        </default>
      </profiles>
    </clickhouse>

  users.xml: |
    <?xml version="1.0"?>
    <clickhouse>
      <profiles>
        {{- range $name, $profile := .Values.clickhouse.config.profiles }}
        <{{ $name }}>
          {{- range $key, $value := $profile }}
          <{{ $key }}>{{ $value }}</{{ $key }}>
          {{- end }}
        </{{ $name }}>
        {{- end }}
      </profiles>

      <users>
        <{{ .Values.clickhouse.auth.username }}>
          <password from_env="CLICKHOUSE_PASSWORD" />
          <profile>default</profile>
          <quota>default</quota>
          <networks>
            <ip>::/0</ip>
          </networks>
          <access_management>1</access_management>
        </{{ .Values.clickhouse.auth.username }}>
      </users>

      <quotas>
        <default>
          <interval>
            <duration>3600</duration>
            <queries>0</queries>
            <errors>0</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>0</execution_time>
          </interval>
        </default>
      </quotas>
    </clickhouse>
---
# Init scripts for table creation
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.clickhouse.name }}-initdb
  namespace: {{ include "telemetryflow.namespace" . }}
data:
  {{- range $name, $script := .Values.clickhouse.initScripts }}
  {{ $name }}: |
    {{- tpl $script $ | nindent 4 }}
  {{- end }}
  {{- if .Values.clickhouse.materializedViews.enabled }}
  {{- range $name, $view := .Values.clickhouse.materializedViews.views }}
  mv-{{ $name }}.sql: |
    {{- $view | nindent 4 }}
  {{- end }}
  {{- end }}
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.name }}-headless
  namespace: {{ include "telemetryflow.namespace" . }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.clickhouse.ports.http }}
    - name: native
      port: {{ .Values.clickhouse.ports.native }}
    - name: interserver
      port: {{ .Values.clickhouse.ports.interserver }}
  selector:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
---
# Client-facing service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.clickhouse.service.type }}
  ports:
    - name: http
      port: {{ .Values.clickhouse.ports.http }}
      targetPort: http
    - name: native
      port: {{ .Values.clickhouse.ports.native }}
      targetPort: native
  selector:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
---
# ClickHouse StatefulSets - one per shard
{{- $shards := int .Values.clickhouse.cluster.shards }}
{{- $replicas := int .Values.clickhouse.cluster.replicasPerShard }}
{{- range $s := until $shards }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Values.clickhouse.name }}-shard{{ $s }}
  namespace: {{ include "telemetryflow.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ $.Values.clickhouse.name }}
    app.kubernetes.io/component: shard{{ $s }}
    {{- include "telemetryflow.labels" $ | nindent 4 }}
spec:
  serviceName: {{ $.Values.clickhouse.name }}-headless
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Values.clickhouse.name }}
      app.kubernetes.io/component: shard{{ $s }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Values.clickhouse.name }}
        app.kubernetes.io/component: shard{{ $s }}
      annotations:
        checksum/config: {{ toYaml $.Values.clickhouse.config | sha256sum }}
    spec:
      {{- include "telemetryflow.imagePullSecrets" $ | nindent 6 }}
      {{- if $.Values.clickhouse.serviceAccount.create }}
      serviceAccountName: {{ $.Values.clickhouse.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with $.Values.clickhouse.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clickhouse
          image: "{{ $.Values.clickhouse.image.repository }}:{{ $.Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ $.Values.clickhouse.image.pullPolicy }}
          env:
            - name: CLICKHOUSE_SHARD
              value: "{{ $s }}"
            - name: CLICKHOUSE_REPLICA
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.clickhouse.auth.existingSecret }}
                  key: {{ $.Values.clickhouse.auth.secretKeys.passwordKey }}
          {{- with $.Values.clickhouse.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $.Values.clickhouse.ports.http }}
            - name: native
              containerPort: {{ $.Values.clickhouse.ports.native }}
            - name: interserver
              containerPort: {{ $.Values.clickhouse.ports.interserver }}
            - name: metrics
              containerPort: {{ $.Values.clickhouse.ports.metrics }}
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ $.Values.clickhouse.ports.http }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ $.Values.clickhouse.ports.http }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml $.Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: ch-data
              mountPath: /var/lib/clickhouse
            - name: ch-config
              mountPath: /etc/clickhouse-server/config.d/config.xml
              subPath: config.xml
            - name: ch-users
              mountPath: /etc/clickhouse-server/users.d/users.xml
              subPath: users.xml
            - name: ch-logs
              mountPath: /var/log/clickhouse-server
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: ch-config
          configMap:
            name: {{ $.Values.clickhouse.name }}-config
            items:
              - key: config.xml
                path: config.xml
        - name: ch-users
          configMap:
            name: {{ $.Values.clickhouse.name }}-config
            items:
              - key: users.xml
                path: users.xml
        - name: ch-logs
          emptyDir: {}
        - name: initdb
          configMap:
            name: {{ $.Values.clickhouse.name }}-initdb
      {{- with $.Values.clickhouse.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $.Values.clickhouse.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: ch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $.Values.clickhouse.persistence.storageClass }}
        {{- if $.Values.clickhouse.persistence.storageClass }}

        storageClassName: {{ $.Values.clickhouse.persistence.storageClass | quote }}

        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.clickhouse.persistence.size }}
  {{- end }}
---
{{- end }}
---
# ZooKeeper for ClickHouse cluster coordination
{{- if .Values.clickhouse.zookeeper.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.name }}-zk-headless
  namespace: {{ include "telemetryflow.namespace" . }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: client
      port: {{ .Values.clickhouse.zookeeper.service.port }}
    - name: peer
      port: 2888
    - name: leader-election
      port: 3888
  selector:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}-zk
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.name }}-zk
  namespace: {{ include "telemetryflow.namespace" . }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.clickhouse.zookeeper.service.port }}
  selector:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}-zk
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.clickhouse.name }}-zk
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}-zk
    {{- include "telemetryflow.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.clickhouse.name }}-zk-headless
  replicas: {{ .Values.clickhouse.zookeeper.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.clickhouse.name }}-zk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.clickhouse.name }}-zk
    spec:
      {{- if .Values.clickhouse.serviceAccount.create }}
      serviceAccountName: {{ .Values.clickhouse.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zookeeper
          image: "{{ .Values.clickhouse.zookeeper.image.repository }}:{{ .Values.clickhouse.zookeeper.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ZOO_MY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ZOO_SERVERS
              {{- $zkReplicas := int .Values.clickhouse.zookeeper.replicas }}
              value: >-
                {{- range $i := until $zkReplicas }}
                server.{{ add $i 1 }}={{ $.Values.clickhouse.name }}-zk-{{ $i }}.{{ $.Values.clickhouse.name }}-zk-headless:2888:3888;{{ $.Values.clickhouse.zookeeper.service.port }}{{ if lt (add $i 1) $zkReplicas }} {{ end }}
                {{- end }}
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "mntr, conf, ruok, srvr, stat"
            - name: ZOO_CFG_EXTRA
              value: "tickTime=2000 initLimit=10 syncLimit=5 maxClientCnxns=2000 autopurge.snapRetainCount=5 autopurge.purgeInterval=1"
          ports:
            - name: client
              containerPort: {{ .Values.clickhouse.zookeeper.service.port }}
            - name: peer
              containerPort: 2888
            - name: leader-election
              containerPort: 3888
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "echo ruok | nc localhost {{ .Values.clickhouse.zookeeper.service.port }} | grep imok"
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "echo ruok | nc localhost {{ .Values.clickhouse.zookeeper.service.port }} | grep imok"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.clickhouse.zookeeper.resources | nindent 12 }}
          volumeMounts:
            - name: zk-data
              mountPath: /data
      {{- with .Values.clickhouse.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.clickhouse.zookeeper.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: zk-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.clickhouse.zookeeper.persistence.storageClass }}
        {{- if .Values.clickhouse.zookeeper.persistence.storageClass }}

        storageClassName: {{ .Values.clickhouse.zookeeper.persistence.storageClass | quote }}

        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.zookeeper.persistence.size }}
  {{- end }}
{{- end }}
---
{{- if .Values.clickhouse.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.clickhouse.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
spec:
  minAvailable: {{ .Values.clickhouse.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.clickhouse.name }}
{{- end }}
{{- end }}
