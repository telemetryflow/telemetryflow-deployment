      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      exec:
        command:
          - pg_isready
          - -U
          - postgres
          - -d
          - telemetryflow_db
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.1-alpine"
    pullPolicy: "IfNotPresent"
  replicas: 1
  persistence:
    enabled: true
    storageClassName: ""
    size: 50Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  env:
    CLICKHOUSE_DB: telemetryflow_db
    CLICKHOUSE_USER: tfo_admin
    CLICKHOUSE_PASSWORD: "<CHANGE_ME>"
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    CLICKHOUSE_LOG_LEVEL: information
  healthChecks:
    liveness:
      enabled: true
      httpGet:
        path: /ping
        port: http
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      httpGet:
        path: /ping
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  ports:
    http:
      containerPort: 8123
      protocol: TCP
    native:
      containerPort: 9000
      protocol: TCP

cacheRedis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: "IfNotPresent"
  persistence:
    enabled: true
    storageClassName: ""
    size: 5Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    REDIS_MAXMEMORY: 1024mb
    REDIS_MAXMEMORY_POLICY: allkeys-lru

redisMaster:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: "IfNotPresent"
  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
