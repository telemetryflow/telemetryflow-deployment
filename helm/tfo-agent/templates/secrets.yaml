{{/*
Secrets — agent chart: only the agent API credentials. Everything else
(database passwords, JWT keys) lives on the platform cluster.
*/}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.tfoAgent.name }}
  namespace: {{ include "telemetryflow.namespace" . }}
  labels:
    {{- include "telemetryflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.tfoAgent.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
