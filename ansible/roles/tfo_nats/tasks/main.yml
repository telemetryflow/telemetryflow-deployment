---
- name: Create nats directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ tfo_platform_install_dir }}"
    - "{{ tfo_nats_data_dir }}"

- name: Deploy nats docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ tfo_nats_compose_file }}"
    mode: "0644"
  notify: restart tfo nats

- name: Pull nats image
  community.docker.docker_image_pull:
    name: "{{ tfo_nats_image }}"
    image: "{{ tfo_nats_image }}"
  tags: [pull]

- name: Start nats
  community.docker.docker_compose_v2:
    project_src: "{{ tfo_platform_install_dir }}"
    files:
      - docker-compose.nats.yml
    project_name: "{{ tfo_platform_compose_project_name }}"
    state: present
  tags: [start]

- name: Wait for nats to accept connections
  ansible.builtin.uri:
    url: "http://{{ tfo_nats_container_ip }}:{{ tfo_nats_management_port }}/healthz"
    method: GET
    status_code: 200
  register: _nats_health
  until: _nats_health.status == 200
  retries: 15
  delay: 2
  tags: [healthcheck]
