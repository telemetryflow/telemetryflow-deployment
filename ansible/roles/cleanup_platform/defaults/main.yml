---
tfo_platform_compose_project_name: "telemetryflow-platform"
tfo_platform_install_dir: "/opt/telemetryflow-platform"
tfo_platform_config_dir: "/etc/telemetryflow-platform"
tfo_platform_log_dir: "/var/log/telemetryflow-platform"

cleanup_containers:
  - "telemetryflow_platform_backend"
  - "telemetryflow_platform_postgres"
  - "telemetryflow_platform_clickhouse"
  - "telemetryflow_platform_redis"
  - "telemetryflow_platform_nats"
  - "telemetryflow_platform_collector"
  - "telemetryflow_platform_viz"
  - "telemetryflow_platform_portainer"

cleanup_dirs:
  - "{{ tfo_platform_install_dir }}"
  - "{{ tfo_platform_config_dir }}"
  - "{{ tfo_platform_log_dir }}"
