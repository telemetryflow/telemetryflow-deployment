---
tfo_valkey_image: "valkey/valkey:9-alpine"
tfo_valkey_container_name: "telemetryflow_platform_valkey"
tfo_valkey_restart_policy: "unless-stopped"
tfo_valkey_log_max_size: "50m"
tfo_valkey_log_max_file: "5"

tfo_valkey_port: 6379
tfo_valkey_password: "<CHANGE_ME>"
tfo_valkey_container_ip: "172.152.152.30"

tfo_valkey_data_dir: "{{ tfo_platform_install_dir }}/data/valkey"

tfo_valkey_compose_file: "{{ tfo_platform_install_dir }}/docker-compose.valkey.yml"
