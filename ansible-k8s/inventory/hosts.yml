all:
  children:
    masters:
      hosts:
        master-01:
          ansible_host: 192.168.1.10   # tfo-master-01
          private_ip: 10.41.90.81      # agent->server URL (intra-VPC)
        # master-02:
        #   ansible_host: 10.0.1.11
        # master-03:
        #   ansible_host: 10.0.1.12
    workers:
      hosts:
        worker-01:
          ansible_host: 192.168.1.11   # tfo-worker-01
          private_ip: 10.41.90.117
        worker-02:
          ansible_host: 192.168.1.12   # tfo-worker-02
          private_ip: 10.41.93.79
        # worker-03:                   # not deployed (node_pools: worker=2)
        #   ansible_host: 10.0.2.13
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # AMI is Debian 13 → default user is 'admin' (not 'ubuntu')
    ansible_user: admin
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../keys/tfo-example-demo.pem"
