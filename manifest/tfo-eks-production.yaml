global:
  environment: production
  clusterName: tfo-eks-production
  timezone: Asia/Jakarta
  domain: telemetryflow.eks
  tls:
    enabled: true
    secretName: telemetryflow-tls
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  annotations:
    eks.amazonaws.com/role-arn: "<CHANGE_ME>"

tfoAgent:
  image:
    tag: "1.4.0"
  clusterProvider: eks
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/os: linux
    node.kubernetes.io/instance-type: m5.xlarge
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "<CHANGE_ME>"

tfoCollector:
  replicas: 3
  persistence:
    size: 100Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  service:
    type: ClusterIP
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  config:
    processors:
      batch:
        send_batch_size: 16384
        send_batch_max_size: 32768
        timeout: 10s
      memory_limiter:
        check_interval: 5s
        ballast_size_mib: 512
        limit_mib: 1536
        spike_limit_mib: 512
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-production
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: tfo-collector

tfoBackend:
  replicas: 3
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    NODE_ENV: production
    LOG_LEVEL: warn
    API_RATE_LIMIT_MAX: "1000"
    API_RATE_LIMIT_WINDOW_MS: "60000"
    DB_POOL_MIN: "10"
    DB_POOL_MAX: "50"
    CLICKHOUSE_TTL_DAYS: "90"
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    tls: true
    tlsSecretName: telemetryflow-api-tls
    host: api.telemetryflow.eks
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-internal: "false"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-production
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: tfo-backend
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "<CHANGE_ME>"
  initContainers:
    seeds:
      enabled: false

tfoViz:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tls: true
    tlsSecretName: telemetryflow-viz-tls
    host: telemetryflow.eks
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-production
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: tfo-viz

postgresql:
  persistence:
    size: 50Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  env:
    POSTGRES_MAX_CONNECTIONS: "300"
    POSTGRES_SHARED_BUFFERS: 1GB
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-db-production

clickhouse:
  persistence:
    size: 200Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-db-production

cacheRedis:
  persistence:
    size: 10Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    REDIS_MAXMEMORY: 400mb

redisMaster:
  persistence:
    size: 20Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    REDIS_MAXMEMORY: 800mb

nats:
  persistence:
    size: 20Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jetstream:
    maxSize: 15Gi
    maxMemory: 512Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels:
      release: prometheus
    honorLabels: true
  exporters:
    redis:
      enabled: true
    nats:
      enabled: true
    postgres:
      enabled: true
    clickhouse:
      enabled: true

secrets:
  create: false
