global:
  environment: staging
  clusterName: tfo-eks-staging
  timezone: Asia/Jakarta
  domain: staging.telemetryflow.eks
  tls:
    enabled: false
  ingress:
    enabled: true
    className: nginx
  podDisruptionBudget:
    enabled: false
  annotations:
    eks.amazonaws.com/role-arn: "<CHANGE_ME>"

tfoAgent:
  image:
    tag: "1.2.1"
  clusterProvider: eks
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector:
    kubernetes.io/os: linux
    node.kubernetes.io/instance-type: m5.large
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "<CHANGE_ME>"

tfoCollector:
  replicas: 1
  persistence:
    size: 10Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-staging
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: tfo-collector

tfoBackend:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    NODE_ENV: staging
  ingress:
    enabled: true
    host: api.staging.telemetryflow.eks
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-staging
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "<CHANGE_ME>"
  initContainers:
    seeds:
      enabled: true

tfoViz:
  replicas: 1
  ingress:
    enabled: true
    host: staging.telemetryflow.eks
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-staging

postgresql:
  persistence:
    size: 20Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-db-staging

clickhouse:
  persistence:
    size: 50Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector:
    kubernetes.io/os: linux
    eks.amazonaws.com/nodegroup: telemetryflow-db-staging

cacheRedis:
  persistence:
    size: 5Gi
    storageClassName: gp3

redisMaster:
  persistence:
    size: 10Gi
    storageClassName: gp3

nats:
  persistence:
    size: 10Gi
    storageClassName: gp3

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus
    honorLabels: true
  exporters:
    redis:
      enabled: true
    nats:
      enabled: true
    postgres:
      enabled: true
    clickhouse:
      enabled: true

secrets:
  create: true
  backend:
    SESSION_SECRET: "<CHANGE_ME>"
    JWT_SECRET: "<CHANGE_ME>"
    JWT_REFRESH_SECRET: "<CHANGE_ME>"
    ENCRYPTION_KEY: "<CHANGE_ME>"
    MFA_ENCRYPTION_KEY: "<CHANGE_ME>"
    LLM_ENCRYPTION_KEY: "<CHANGE_ME>"
    DB_MONITORING_ENCRYPTION_KEY: "<CHANGE_ME>"
    POSTGRES_PASSWORD: "<CHANGE_ME>"
    CLICKHOUSE_PASSWORD: "<CHANGE_ME>"
    REDIS_PASSWORD: ""
    SMTP_PASSWORD: ""
    TELEMETRYFLOW_API_KEY_SECRET: "<CHANGE_ME>"
    TELEMETRYFLOW_VIZ_PASSWORD: "<CHANGE_ME>"
    RECAPTCHA_SECRET_KEY: ""
    ADMIN_PASSWORD: "<CHANGE_ME>"
    SUPER_ADMIN_PASSWORD: "<CHANGE_ME>"
  agent:
    API_KEY_ID: "<CHANGE_ME>"
    API_KEY: "<CHANGE_ME>"
